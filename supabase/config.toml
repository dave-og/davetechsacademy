# Supabase Project Configuration for Dave Techs Academy
# Project ID: davetechs-academy

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = [
  "https://davetechs.com",
  "https://davetechs.com/auth/callback",
  "http://localhost:5173/auth/callback",
  "https://davetechs.com/payment/callback",
  "http://localhost:5173/payment/callback"
]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[auth.external.google]
enabled = true
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_CLIENT_SECRET)"
redirect_uri = "http://localhost:54321/auth/v1/callback"

[storage]
enabled = true
file_size_limit = "50MiB"

[functions.initialize-payment]
verify_jwt = true

[functions.verify-payment]
verify_jwt = true

[functions.payment-webhook]
verify_jwt = false
